<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Jailex Overlay Lightstream-Safe</title>
    <style>
        body { background: transparent; color: white; font-family: sans-serif; overflow: hidden; margin: 0; padding: 25px; display: flex; align-items: flex-end; justify-content: flex-start; height: 100vh; box-sizing: border-box; }
        
        #chat-container { 
            display: flex; 
            flex-direction: column; 
            gap: 10px;
            width: 450px;
            max-height: 90vh;
        }

        .msg { 
            /* Bears Navy with Dynamic Transparency */
            background: rgba(6, 14, 26, var(--bg-alpha)); 
            border-left: 6px solid #C83803; /* Bears Orange */
            padding: 12px 18px; 
            border-radius: 0 12px 12px 0; 
            width: fit-content;
            max-width: 90%;
            font-size: var(--fs);
            /* Reduced shadow complexity for better performance */
            box-shadow: 2px 4px 10px rgba(0,0,0,0.3);
            /* Hardware acceleration for smooth animation */
            will-change: transform, opacity;
            animation: slideIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            transition: opacity 0.5s ease-out, transform 0.5s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-50px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .user { font-weight: bold; color: #00d2ff; font-size: 0.8em; margin-bottom: 3px; display: block; text-transform: uppercase; }
        .platform { font-size: 0.7em; margin-right: 5px; opacity: 0.7; color: #fff; }
    </style>
</head>
<body>
    <div id="chat-container"></div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const twitchChannel = params.get('twitch') || 'justquitbro7';
        const kickId = params.get('kick') || '92474944';
        const fontSize = params.get('size') || '22';
        const stayTime = (params.get('stay') || '20') * 1000;
        const bgOpacity = params.get('alpha') || '0.9'; // Default 90% solid

        // Apply URL parameters to CSS variables
        document.documentElement.style.setProperty('--fs', fontSize + 'px');
        document.documentElement.style.setProperty('--bg-alpha', bgOpacity);

        function addMessage(user, message, platform) {
            const container = document.getElementById('chat-container');
            
            // PERFORMANCE FIX: Prevent DOM overload by removing oldest messages
            if (container.children.length > 20) {
                container.removeChild(container.firstChild);
            }

            const div = document.createElement('div');
            div.className = 'msg';
            
            // Set platform colors
            let pColor = platform === 'Twitch' ? '#9146FF' : '#53FC18';
            if (platform === 'INFO') pColor = '#00d2ff';

            div.innerHTML = '<div class="user" style="color:' + pColor + '"><span class="platform">[' + platform + ']</span>' + user + '</div>' +
                            '<div>' + message + '</div>';
            
            // Append to the bottom so it grows UP
            container.appendChild(div);
            
            // Auto-remove with hardware accelerated transition
            setTimeout(function() {
                div.style.opacity = '0';
                div.style.transform = 'translateX(-20px)';
                setTimeout(function() { 
                    if(div.parentNode) div.remove(); 
                }, 500);
            }, stayTime);
        }

        // TWITCH DIRECT CONNECT
        function connectTwitch() {
            var tws = new WebSocket('wss://irc-ws.chat.twitch.tv:443');
            tws.onopen = function() {
                tws.send('PASS ignore');
                tws.send('NICK justinfan' + Math.floor(Math.random()*999));
                tws.send('JOIN #' + twitchChannel.toLowerCase());
            };
            tws.onmessage = function(e) {
                if(e.data.includes('PRIVMSG')) {
                    var u = e.data.split('!')[0].substring(1);
                    var m = e.data.substring(e.data.indexOf(':', 1) + 1);
                    addMessage(u, m, 'Twitch');
                }
                if(e.data.includes('PING')) tws.send('PONG :tmi.twitch.tv');
            };
            tws.onclose = function() { setTimeout(connectTwitch, 5000); };
        }

        // KICK DIRECT CONNECT
        function connectKick() {
            var kws = new WebSocket('wss://ws-us2.pusher.com/app/32cbd69e4b950bf97679?protocol=7&client=js&version=7.6.0');
            kws.onopen = function() {
                kws.send(JSON.stringify({ event: "pusher:subscribe", data: { channel: "chatrooms." + kickId + ".v2" } }));
                setInterval(function() { kws.send(JSON.stringify({event:"pusher:ping",data:{}})); }, 20000);
            };
            kws.onmessage = function(e) {
                var d = JSON.parse(e.data);
                if (d.event === "App\\Events\\ChatMessageEvent") {
                    var msg = JSON.parse(d.data);
                    addMessage(msg.sender.username, msg.content, 'Kick');
                }
            };
            kws.onclose = function() { setTimeout(connectKick, 5000); };
        }

        connectTwitch();
        connectKick();

        // System Start Message
        setTimeout(function() { addMessage('SYSTEM', 'Jailex v1.3.0 Loaded & Optimized!', 'INFO'); }, 2000);
    </script>
</body>
</html>
