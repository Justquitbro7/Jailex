<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jailex Stream Overlay - justquitbro7</title>
    <style>
        /* JAILEX OVERLAY STYLES
        Optimized for Xbox/Lightstream 1080p output.
        */
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: transparent; /* Makes the background invisible in Lightstream */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        }

        #overlay-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        /* Top Bar for Alerts */
        #alert-box {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 30px;
            border-radius: 50px;
            border: 2px solid #00e6e6; /* Cyan Glow */
            font-weight: bold;
            font-size: 1.2rem;
            display: none; /* Hidden until an alert happens */
        }

        /* Bottom Left Chat */
        #chat-container {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 350px;
            height: 400px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            padding: 10px;
        }

        .chat-message {
            margin-bottom: 8px;
            animation: fadeIn 0.3s ease-in;
        }

        .user-name {
            font-weight: bold;
            color: #00e6e6;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* API Status Indicator (Bottom Right) */
        #status-indicator {
            position: absolute;
            bottom: 10px;
            right: 10px;
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body>

    <div id="overlay-container">
        <div id="alert-box">NEW FOLLOWER!</div>

        <div id="chat-container">
            <div class="chat-message"><span class="user-name">Jailex:</span> System Online. Waiting for stream...</div>
        </div>

        <div id="status-indicator">API STATUS: <span id="api-state">CONNECTING...</span></div>
    </div>

    <script>
        /**
         * JAILEX OVERLAY LOGIC
         * This script connects to your /api folder to get data.
         */
        
        async function checkApiStatus() {
            const statusLabel = document.getElementById('api-state');
            try {
                // Fetching from your new API folder
                const response = await fetch('/api');
                const data = await response.json();
                
                if (data.status === "online") {
                    statusLabel.textContent = "ONLINE";
                    statusLabel.style.color = "#00ff00";
                    console.log("Jailex API is connected!");
                }
            } catch (error) {
                statusLabel.textContent = "OFFLINE";
                statusLabel.style.color = "#ff0000";
                console.log("API Connection Error:", error);
            }
        }

        // Run status check when the overlay starts
        checkApiStatus();

        // Optional: Function to show a test alert
        function showTestAlert(message) {
            const alertBox = document.getElementById('alert-box');
            alertBox.textContent = message;
            alertBox.style.display = 'block';
            setTimeout(() => {
                alertBox.style.display = 'none';
            }, 5000);
        }
    </script>
</body>
</html>
